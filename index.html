<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
    #status { margin: 1rem 0 .5rem; padding: .5rem .75rem; border-radius: .25rem; background: #f2f2f2; }
    #status:empty { display: none; }
    #status[data-kind="ok"] { background: #e7f4e8; }
    #status[data-kind="manual"] { background: #fff1d6; }
    #status[data-kind="error"] { background: #fbe3e1; }
    #draft { margin: .25rem 0 0; padding: .75rem; border: 1px solid #ccc; border-radius: .25rem; font: inherit; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section id="result" hidden>
    <p><strong>Тема:</strong> <span id="topic"></span></p>
    <p><strong>Черновик ответа</strong> (проверьте перед отправкой клиенту):</p>
    <pre id="draft"></pre>
  </section>
  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цена и стоимость", other: "Другое" };
    const REQUEST_TIMEOUT_MS = 5000;

    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const button = form.querySelector("button");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");

    // Номер последнего запроса: ответ на более ранний запрос не перезапишет свежий.
    let lastRequestId = 0;

    function showStatus(text, kind) {
      status.textContent = text;
      status.dataset.kind = kind;
    }

    function clearResult() {
      result.hidden = true;
      topic.textContent = "";
      draft.textContent = "";
    }

    // Всё выводим через textContent: текст от модели не исполняется как HTML.
    function render(httpStatus, data) {
      if (httpStatus === 200 && data?.status === "ready") {
        topic.textContent = TOPIC_LABELS[data.topic] ?? data.topic;
        draft.textContent = data.draft;
        result.hidden = false;
        showStatus("Черновик готов.", "ok");
      } else if (httpStatus === 200 && data?.status === "manual_review") {
        showStatus("Не удалось подготовить черновик автоматически. Разберите заявку вручную.", "manual");
      } else if (httpStatus === 400 && data?.status === "invalid_input") {
        showStatus("Введите текст заявки: поле пустое.", "error");
      } else {
        showStatus(`Сервер ответил ошибкой (код ${httpStatus}). Попробуйте ещё раз.`, "error");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const requestId = ++lastRequestId;
      clearResult();
      showStatus("Разбираем заявку…", "pending");
      button.disabled = true;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
          signal: AbortSignal.timeout(REQUEST_TIMEOUT_MS),
        });
        const data = await reply.json().catch(() => null);
        if (requestId !== lastRequestId) return;
        render(reply.status, data);
      } catch {
        if (requestId !== lastRequestId) return;
        showStatus("Нет ответа от сервера. Проверьте соединение и попробуйте ещё раз.", "error");
      } finally {
        if (requestId === lastRequestId) button.disabled = false;
      }
    });
  </script>
</body>
</html>
